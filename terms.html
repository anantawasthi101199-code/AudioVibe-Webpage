<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terms of Service - AudioVibe by Alpha Tech Labs</title>
  <meta name="description" content="The terms that govern your use of AudioVibe, the audio-first social platform." />
  <link rel="canonical" href="https://api.audiovibe.co/terms" />
  <meta http-equiv="refresh" content="0; url=https://api.audiovibe.co/terms" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #22d3ee; --blue-deep: #1f74ec;
      --bg-darkest: #0a0a0a; --bg-card: #1a1a1a; --border: #27272a;
      --text-primary: #ffffff; --text-secondary: #a1a1aa; --text-muted: #71717a;
    }
    body {
      background: var(--bg-darkest); color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      line-height: 1.7; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      max-width: 460px; text-align: center; padding: 36px 28px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    }
    h1 {
      font-size: 1.4rem; font-weight: 800; margin-bottom: 12px;
      background: linear-gradient(135deg, var(--blue), var(--blue-deep));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    p { font-size: 0.92rem; color: var(--text-secondary); margin-bottom: 20px; }
    a.btn {
      display: inline-block; padding: 10px 20px; border-radius: 99px;
      font-size: 0.88rem; font-weight: 700; text-decoration: none; color: var(--bg-darkest);
      background: linear-gradient(135deg, var(--blue), var(--blue-deep));
    }
    .foot { margin-top: 24px; font-size: 0.78rem; color: var(--text-muted); }
    .foot a { color: var(--text-muted); text-decoration: none; }
    .foot a:hover { color: var(--blue); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Terms of Service</h1>
    <p>The AudioVibe Terms of Service are served from our application domain. You should be redirected automatically.</p>
    <a class="btn" href="https://api.audiovibe.co/terms">Read the Terms of Service</a>
    <div class="foot">
      <a href="privacy.html">Privacy Policy</a> &nbsp;&middot;&nbsp;
      <a href="delete-account.html">Delete account</a> &nbsp;&middot;&nbsp;
      <a href="support.html">Support</a> &nbsp;&middot;&nbsp;
      <a href="https://audiovibe.co">audiovibe.co</a>
    </div>
  </div>
</body>
</html>
